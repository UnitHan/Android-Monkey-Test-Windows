[package]
name = "monkey-test"
version = "4.0.6"
description = "Android Monkey Test desktop shell"
edition = "2021"

[lib]
name = "monkey_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
